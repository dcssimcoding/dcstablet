[package]
name = "dcs-tablet"
version = "0.1.1"
edition = "2024"
description = "DCS Tablet: F/A-18C displays and touch controls over local WebRTC"
license = "MIT"

[features]
default = []
test-hooks = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
httparse = "1.10.1"
str0m = { version = "0.24.1", default-features = false, features = ["wincrypto"] }
windows-capture = "2.0.1"

windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_Media_MediaFoundation"] }

[profile.release]
lto = "thin"
strip = true
